<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resilient Event Hub</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <section class="event-hero">
      <p class="eyebrow">Upcoming Event</p>

      <h1>Web Engineering Summit 2026</h1>

      <p class="event-description">
        A resilient landing page powered by a drift-free countdown
        and a state-driven registration form.
      </p>

      <div
        id="countdown"
        data-deadline="2026-12-31T16:00:00Z"
        aria-label="Event countdown"
      >
        <div>
          <strong id="days">00</strong>
          <span>Days</span>
        </div>

        <div>
          <strong id="hours">00</strong>
          <span>Hours</span>
        </div>

        <div>
          <strong id="minutes">00</strong>
          <span>Minutes</span>
        </div>

        <div>
          <strong id="seconds">00</strong>
          <span>Seconds</span>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
