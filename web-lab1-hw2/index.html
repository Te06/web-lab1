<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drum Kit Engine</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>Drum Kit Engine</h1>

    <section class="drum-kit" aria-label="Drum Kit">
      <button
        class="drum-pad"
        type="button"
        data-key="a"
        data-sound="sounds/alien.ogg">
        <strong>A</strong>
        <span>Alien</span>
      </button>

      <button
        class="drum-pad"
        type="button"
        data-key="s"
        data-sound="sounds/door_knock.wav">
        <strong>S</strong>
        <span>Door Knock</span>
      </button>

      <button
        class="drum-pad"
        type="button"
        data-key="d"
        data-sound="sounds/music_randomly.mp3">
        <strong>D</strong>
        <span>Music</span>
      </button>

      <button
        class="drum-pad"
        type="button"
        data-key="f"
        data-sound="sounds/sang_bark.wav">
        <strong>F</strong>
        <span>Bark</span>
      </button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
